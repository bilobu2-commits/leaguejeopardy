<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League of Legends Quiz — Board 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="site-header">
    <h1 class="site-title">League of Legends Quiz</h1>
    <div class="site-subtitle">Board 1 von 2 · <a href="index-en.html" style="color:var(--gold)">EN</a></div>
    <div class="divider"></div>
  </header>

  <div id="master-bar" class="master-bar">
    <label for="master-code-input">Gamemaster-Code</label>
    <input type="password" id="master-code-input" placeholder="Code eingeben">
    <button id="master-code-btn">Freischalten</button>
    <span id="master-status"></span>
  </div>

  <div id="board" class="board"></div>

  <div class="buzzer-section">
    <div id="buzzer-result" class="buzzer-result"></div>
    <div id="buzzer-grid" class="buzzer-grid"></div>
    <button id="buzzer-reset-btn" class="btn">Buzzer zurücksetzen</button>
  </div>

  <div class="controls-row">
    <button id="reset-board-btn">Board zurücksetzen</button>
    <button id="reset-scores-btn">Punkte zurücksetzen</button>
  </div>

  <div id="scoreboard" class="scoreboard"></div>

  <nav class="board-nav">
    <a href="board2.html">Weiter zu Board 2 →</a>
  </nav>

</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-cat" class="cat"></span>
      <span id="modal-val" class="val"></span>
    </div>
    <div class="modal-body">
      <span id="modal-tag" class="modal-tag"></span>
      <img id="modal-image" class="modal-image" alt="Bildfrage">
      <div id="modal-question" class="modal-question"></div>
      <div id="modal-answer" class="modal-answer"></div>
    </div>
    <div class="modal-actions">
      <button id="show-answer-btn" class="btn btn-primary master-only">Antwort zeigen</button>
      <button id="close-btn" class="btn">Schließen</button>
      <div id="score-row" class="score-row"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data-board1.js"></script>
<script src="app.js"></script>
</body>
</html>
